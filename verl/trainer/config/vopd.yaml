defaults:
  - ppo_trainer
  - user
  - _self_

# MAX_PROMPT_LENGTH=2048
# MAX_RESPONSE_LENGTH=8192
# MAX_FEEDBACK_LENGTH=8192
# TEMPLATE_LENGTH=512  # heuristic upper bound, not enforced
# MAX_MODEL_LEN=$((TEMPLATE_LENGTH + MAX_PROMPT_LENGTH + MAX_FEEDBACK_LENGTH + MAX_RESPONSE_LENGTH))
max_model_len: 18944

actor_rollout_ref:
  model:
    pre_fsdp_model_hook: pkg://vision_opd_selector.fsdp_hook:apply_vision_selector_before_fsdp
    vision_selector:
      enabled: true
      budget: 0.2
      rollout_budgets: null
      eval_budget: null
      hidden_dim: 1024
      init_scale: 0.0001
      checkpoint: null
      llm_train_mode: frozen
    lora_rank: 0
    lora_adapter_path: null
  actor:
    ppo_mini_batch_size: 32 # TODO: make slightly off-policy in the future; use same as baseline; perhaps make 1 again for fastest convergence
    policy_loss:
      loss_mode: vopd
    self_distillation:
      max_reprompt_len: 10240
      alpha: 0.5
      is_clip: 2.0
      distillation_topk: 100
      distillation_add_tail: true
      teacher_always_on: true
      teacher_model_source: fixed
      teacher_model_path: ${actor_rollout_ref.model.path}
      teacher_input_mode: same_input
      teacher_regularization: fixed
      teacher_image_key: null
      fallback_to_policy_loss_on_missing_teacher: false
    optim:
      lr: 1e-5
  rollout:
    n: 8
    calculate_log_probs: True
    engine_kwargs:
      vllm:
        model_impl: auto
        hf_overrides:
          architectures:
            - Qwen2_5_VLForConditionalGenerationWithVisionSelector
          vision_selector:
            enabled: ${actor_rollout_ref.model.vision_selector.enabled}
            budget: ${actor_rollout_ref.model.vision_selector.budget}
            hidden_dim: ${actor_rollout_ref.model.vision_selector.hidden_dim}
            init_scale: ${actor_rollout_ref.model.vision_selector.init_scale}

algorithm:
  adv_estimator: grpo # disables critic
  norm_adv_by_std_in_grpo: False
  rollout_correction:
    rollout_is: token
    rollout_is_threshold: 2.0

data:
  train_batch_size: 32

trainer:
  val_before_train: False
